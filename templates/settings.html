{% extends "base.html" %}
{% block title %}Ayarlar - Kitap Takip{% endblock %}
{% block content %}
<div class="form-card card">
  <div class="card-body p-4">
    <h1 class="h4 mb-4">Ayarlar</h1>
    <form method="post">
      <label class="form-label">Yıllık kitap hedefi</label>
      <input class="form-control mb-3" type="number" min="1" name="annual_goal" value="{{ goal }}" required>
      <button class="btn btn-primary">Kaydet</button>
    </form>
  </div>
</div>
{% endblock %}
