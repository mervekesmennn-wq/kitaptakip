{% extends "base.html" %}
{% block title %}Elle Kitap Ekle - Kitap Takip{% endblock %}
{% block content %}
<div class="form-card card">
  <div class="card-body p-4">
    <h1 class="h4 mb-4">Elle Kitap Ekle</h1>
    <form method="post" enctype="multipart/form-data">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Kitap adı *</label><input class="form-control" name="title" required></div>
        <div class="col-md-6"><label class="form-label">Yazar</label><input class="form-control" name="author"></div>
        <div class="col-md-6"><label class="form-label">Yayınevi</label><input class="form-control" name="publisher"></div>
        <div class="col-md-6"><label class="form-label">ISBN</label><input class="form-control" name="isbn"></div>
        <div class="col-md-4"><label class="form-label">Sayfa sayısı *</label><input class="form-control" type="number" min="1" name="page_count" required></div>
        <div class="col-md-4"><label class="form-label">Yayın yılı</label><input class="form-control" name="publication_year"></div>
        <div class="col-md-4"><label class="form-label">Raf</label><select class="form-select" name="status"><option>Okunacak</option><option>Okunuyor</option><option>Okundu</option></select></div>
        <div class="col-12"><label class="form-label">Kapak görseli</label><input class="form-control" type="file" name="cover" accept="image/*"></div>
      </div>
      <button class="btn btn-primary mt-4">Kaydet</button>
    </form>
  </div>
</div>
{% endblock %}
